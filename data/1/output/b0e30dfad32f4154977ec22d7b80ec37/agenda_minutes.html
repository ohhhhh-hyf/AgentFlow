<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>议程纪要</title>
    <style>

    body {
      margin: 0;
      padding: 14px 12px;
      background: #f6f5f0;
      color: #1a1a1a;
      font-family: "Latin Modern Roman", "Computer Modern Roman", "CMU Serif", "Times New Roman", Times, "Songti SC", "SimSun", "STSong", serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 1140px; margin: 0 auto; }
    .ck-doc {
      background: #ffffff;
      border: 1px solid #d4d0c7;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0,0,0,0.03);
      padding: 18px 22px;
      line-height: 1.6;
      font-size: 0.84rem;      /* 正文基准：左右两栏共用 --ck-fs */
      --ck-fs: 0.84rem;
    }
    .ck-doc h1 {
      margin: 0 0 6px;
      font-size: 1.05rem;      /* 文档标题：只比正文略大一点 */
      font-weight: 700;
      text-align: center;
      color: #111111;
    }
    .ck-doc-header {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #111111;
      text-align: center;
    }
    .ck-doc-meta {
      font-size: 0.78rem;
      color: #555555;
      font-style: italic;
    }
    /* 层级标题一律"加粗 + 与右栏同级字号"，不加字号、不加下划线，前后留白压到最小 */
    .ck-doc-content h1, .ck-doc-content .ck-doc-h1,
    .ck-doc h2, .ck-doc-h2,
    .ck-doc h3, .ck-doc-h3,
    .ck-doc h4, .ck-doc-h4 {
      font-size: var(--ck-fs);
      font-weight: 700;
      color: #111111;
      border-bottom: 0;
      padding-bottom: 0;
      letter-spacing: 0;
      font-variant: normal;
      text-align: left;
    }
    .ck-doc-content h1, .ck-doc-content .ck-doc-h1, .ck-doc h2, .ck-doc-h2 {
      margin: 12px 0 4px;
    }
    .ck-doc h3, .ck-doc-h3, .ck-doc h4, .ck-doc-h4 {
      margin: 9px 0 3px;
    }
    .ck-doc p {
      margin: 5px 0;
      line-height: 1.6;
      text-align: justify;
    }
    .ck-doc ul, .ck-doc ol {
      margin: 4px 0 6px;
      padding-left: 1.25em;
      line-height: 1.6;
    }
    .ck-doc li {
      margin: 2px 0;
    }
    .ck-doc blockquote, .ck-quote {
      margin: 6px 0 8px;
      padding: 5px 10px;
      background: #faf9f6;
      border-left: 3px solid #222222;
      border-radius: 2px;
      color: #222222;
      font-size: var(--ck-fs);
      font-style: italic;
    }
    .ck-doc code {
      background: #f3f0e8;
      border: 1px solid #e2ddd3;
      border-radius: 3px;
      padding: 1px 6px;
      font-family: "Latin Modern Mono", Consolas, monospace;
      font-size: 0.88em;
    }
    .ck-doc table, .ck-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--ck-fs);
      margin: 8px 0;
      background: #ffffff;
      border-top: 2px solid #222222;
      border-bottom: 2px solid #222222;
    }
    .ck-doc table th, .ck-table th {
      padding: 6px 10px;
      text-align: left;
      vertical-align: middle;
      background: #fbfaf7;
      border-bottom: 1.2px solid #222222;
      font-weight: 700;
      color: #111111;
      letter-spacing: 0.3px;
    }
    .ck-doc table td, .ck-table td {
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid #ede9e1;
    }
    .ck-doc table td:first-child, .ck-table td:first-child {
      font-weight: 600;
      color: #111111;
    }

    /* Roomy & Spacious Academic Risk Table */
    .ck-risk-table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0 28px;
      background: #ffffff;
      border-top: 2.2px solid #111111;
      border-bottom: 2.2px solid #111111;
      font-size: 0.93rem;
      line-height: 1.72;
    }
    .ck-risk-table th {
      background: #faf8f5;
      border-bottom: 1.5px solid #111111;
      padding: 15px 16px;
      font-weight: 700;
      color: #111111;
      letter-spacing: 0.3px;
      text-align: left;
      vertical-align: middle;
    }
    .ck-risk-table td {
      padding: 16px 16px;
      border-bottom: 1px solid #ede8e0;
      vertical-align: top;
      color: #1a1a1a;
      word-break: break-word;
    }
    .ck-risk-table tr:nth-child(even) td {
      background: #fdfcfb;
    }
    .ck-risk-table tr:hover td {
      background: #f6f3eb;
    }

    /* Review Grid */
    .ck-review {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) 1px minmax(260px, 0.95fr);
      border: 1px solid #d4d0c7;
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0 10px;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .ck-review-left {
      padding: 14px 16px;
      background: #ffffff;
      line-height: 1.6;
      font-size: var(--ck-fs);
    }
    .ck-review-rule { background: #dcd8cf; }
    .ck-review-right {
      padding: 12px 14px;
      background: #faf9f6;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .ck-ev-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Entity Highlight in LaTeX Paper Style */
    .ck-cite-entity {
      background: #fff8db;
      border-bottom: 1.5px solid #b86a04;
      padding: 1px 4px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.18s ease;
      color: #111111;
      font-weight: 600;
    }
    .ck-cite-entity:hover {
      background: #ffe58f;
      color: #000000;
    }
    .ck-cite-entity.is-on {
      background: #ffd54a;
      border-bottom-color: #0047ab;
      box-shadow: 0 0 0 2px rgba(0,71,171,0.25);
    }

    /* Blue Hyperref Citations [1], [2] */
    .ck-cite-ref {
      color: #0047ab;
      font-weight: 600;
      font-family: "Latin Modern Roman", "Computer Modern Roman", "Times New Roman", serif;
      text-decoration: none;
      cursor: pointer;
      padding: 0 2px;
      margin: 0 2px;
      border-radius: 2px;
      transition: all 0.15s ease;
      font-size: 0.92em;
      vertical-align: baseline;
      user-select: none;
    }
    .ck-cite-ref:hover {
      text-decoration: underline;
      background: #e8f0fe;
      color: #003380;
    }
    .ck-cite-ref.is-active {
      background: #d2e3fc;
      color: #002266;
      font-weight: 700;
      box-shadow: 0 0 0 1px #0047ab;
    }

    /* Right Memory Cards in LaTeX Paper Style */
    .ck-provenance-head {
      font-size: 0.82rem;
      font-weight: 700;
      color: #222222;
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e0dcd4;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .ck-ref-icon { color: #0047ab; margin-right: 4px; }
    .ck-ev {
      display: block;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid #dedad2;
      border-left: 3.5px solid #0047ab;
      border-radius: 2px;
      background: #ffffff;
      font-size: 0.82rem;
      line-height: 1.55;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .ck-ev:hover { border-color: #b5b0a5; }
    .ck-ev.is-on, .ck-ev.is-highlighted {
      border-color: #0047ab;
      box-shadow: 0 0 0 2px #0047ab, 0 3px 8px rgba(0,71,171,0.15);
      background: #f0f5ff;
    }
    @keyframes citePulse {
      0% { background: #dbeafe; box-shadow: 0 0 0 3px #0047ab; }
      50% { background: #bfdbfe; box-shadow: 0 0 0 4px #0047ab; }
      100% { background: #f0f5ff; box-shadow: 0 0 0 2px #0047ab; }
    }
    .ck-ev-k {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #444444;
      margin-bottom: 5px;
      font-weight: 700;
    }
    .ck-ev-cite-tag {
      color: #0047ab;
      font-weight: 700;
      font-family: "Latin Modern Roman", serif;
      text-decoration: none;
    }
    .ck-ev-kind-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 2px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .ck-badge-keypoint {
      border: 1px solid #0047ab;
      color: #0047ab;
      background: #f0f5ff;
    }
    .ck-badge-note {
      border: 1px solid #b86a04;
      color: #b86a04;
      background: #fff8eb;
    }
    .ck-mem-title {
      font-weight: 700;
      color: #111111;
      font-size: var(--ck-fs);
      margin-bottom: 4px;
      line-height: 1.5;
    }
    .ck-ev-quote {
      color: #222222;
      font-style: normal;
      font-family: inherit;
      margin: 4px 0 6px;
      padding: 0;
      background: transparent;
      border: none;
      line-height: 1.6;
      font-size: var(--ck-fs);
    }
    .ck-ev-meta { font-size: 0.76rem; color: #666666; margin-top: 4px; }
    .ck-ev-more {
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ck-ev-more[open] { margin-top: 4px; }
    .ck-ev-more summary { margin-bottom: 6px; }
    .ck-proof-toggle {
      cursor: pointer;
      font-size: 0.82rem;
      color: #0047ab;
      user-select: none;
      font-family: inherit;
      padding: 2px 0;
    }
    .ck-proof-toggle:hover { text-decoration: underline; }
    /* 右栏下段"状态演进"：无行内锚点，与上方证据卡视觉区分（灰底 + 徽章，无 [n]） */
    .ck-ledger {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #d4d0c7;
    }
    .ck-ledger > summary { list-style: none; }
    .ck-ledger > summary::-webkit-details-marker { display: none; }
    .ck-ledger > summary::after { content: " ▾"; }
    .ck-ledger:not([open]) > summary::after { content: " ▸"; }
    /* 每类一张小灰卡：卡头类别 + 条数，卡内按 1. 2. 3. 编号 */
    .ck-ledger-card {
      background: #faf9f5;
      border: 1px solid #e6e2d8;
      border-left: 3px solid #bdb6a6;
      border-radius: 4px;
      padding: 7px 9px;
      margin-bottom: 6px;
    }
    .ck-ledger-k {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      margin-bottom: 5px;
    }
    .ck-ledger-badge {
      background: #efece4;
      color: #6b6559;
      border-radius: 3px;
      padding: 1px 6px;
      font-weight: 600;
    }
    .ck-ledger-count { color: #8a8578; }
    .ck-ledger-list {
      margin: 0;
      padding-left: 1.35em;
      font-size: var(--ck-fs);
      line-height: 1.6;
      color: #3b3a37;
    }
    .ck-ledger-list > li { margin: 2px 0; }
    /* Personal Perspective Interactive Task Lists & Semantic Blocks */
    .ck-self-block {
      background: #f4f8fe;
      border: 1px solid #d4e2f5;
      border-left: 3.5px solid #0047ab;
      border-radius: 4px;
      padding: 9px 13px;
      margin: 10px 0 12px;
    }
    .ck-self-title {
      margin: 0 0 6px;
      color: #003380;
      font-weight: 700;
      font-size: var(--ck-fs);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .ck-self-badge {
      display: inline-block;
      background: #0047ab;
      color: #ffffff;
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 2px;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-left: 4px;
    }

    .ck-dep-block {
      background: #fefcf7;
      border: 1px solid #f2e7cc;
      border-left: 3.5px solid #b86a04;
      border-radius: 4px;
      padding: 9px 13px;
      margin: 10px 0 12px;
    }
    .ck-dep-title {
      margin: 0 0 6px;
      color: #7a4502;
      font-weight: 700;
      font-size: var(--ck-fs);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .ck-dep-badge {
      display: inline-block;
      background: #b86a04;
      color: #ffffff;
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 2px;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-left: 4px;
    }

    .ck-risk-block {
      background: #fff8f8;
      border: 1px solid #fedcdc;
      border-left: 3.5px solid #cf222e;
      border-radius: 4px;
      padding: 9px 13px;
      margin: 10px 0 12px;
    }
    .ck-risk-title {
      margin: 0 0 6px;
      color: #a40e26;
      font-weight: 700;
      font-size: var(--ck-fs);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .ck-risk-badge {
      display: inline-block;
      background: #cf222e;
      color: #ffffff;
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 2px;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-left: 4px;
    }

    .ck-self-block ul, .ck-self-block ol,
    .ck-dep-block ul, .ck-dep-block ol,
    .ck-risk-block ul, .ck-risk-block ol {
      margin: 2px 0 2px;
      padding-left: 1.25em;
    }
    .ck-self-block li, .ck-dep-block li, .ck-risk-block li {
      margin: 2px 0;
      color: #1a1a1a;
    }

    /* Person Group Heading */
    .ck-person-group {
      margin: 8px 0 3px;
      font-weight: 700;
      color: #111111;
    }

    /* GFM Task List Checkboxes */
    .ck-task-list {
      list-style: none;
      padding-left: 0 !important;
      margin: 4px 0 6px !important;
    }
    .ck-task-item {
      display: flex;
      align-items: flex-start;
      margin: 4px 0;
      line-height: 1.6;
    }
    .ck-task-label {
      display: inline-flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      width: 100%;
    }
    .ck-task-checkbox {
      margin-top: 4px;
      cursor: pointer;
      accent-color: #0047ab;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    .ck-task-checkbox:checked + .ck-task-text {
      color: #8c8c8c;
      text-decoration: line-through;
    }
    .ck-task-text {
      flex: 1;
      color: #1a1a1a;
    }

    /* Status Badges & Pills */
    .ck-tag-blocker {
      display: inline-block;
      background: #ffebe9;
      color: #cf222e;
      border: 1px solid rgba(255, 129, 130, 0.45);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0 5px;
      border-radius: 3px;
      margin-right: 4px;
      line-height: 1.5;
      vertical-align: 1px;
    }
    .ck-tag-risk {
      display: inline-block;
      background: #fff8eb;
      color: #b86a04;
      border: 1px solid rgba(212, 167, 44, 0.45);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0 5px;
      border-radius: 3px;
      margin-right: 4px;
      line-height: 1.5;
      vertical-align: 1px;
    }
    .ck-tag-warn {
      display: inline-block;
      background: #f0f4ff;
      color: #0969da;
      border: 1px solid rgba(84, 174, 255, 0.45);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0 5px;
      border-radius: 3px;
      margin-right: 4px;
      line-height: 1.5;
      vertical-align: 1px;
    }
    .ck-tag-dep {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0 5px;
      border-radius: 3px;
      margin-right: 4px;
      line-height: 1.5;
      vertical-align: 1px;
    }
    .ck-param-capsule {
      display: inline-block;
      font-size: 0.82rem;
      color: #57606a;
      background: #f6f8fa;
      border: 1px solid #eaeef2;
      padding: 0 6px;
      border-radius: 10px;
      margin-left: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.2px;
    }

    /* 现代极简公文流排版（高信息密度、紧凑精练、无冗余卡片留白） */
    .ck-card, .ck-flow-group {
      margin-bottom: 14px;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }
    .ck-card:last-child, .ck-flow-group:last-child {
      margin-bottom: 0;
    }
    .ck-card-category {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #e2e8f0;
      width: 100%;
    }
    .ck-card-accent {
      width: 3px;
      height: 13px;
      border-radius: 1.5px;
      background: #2563eb;
      flex-shrink: 0;
    }
    .ck-card-accent-risk {
      background: #dc2626;
    }
    .ck-card-accent-risk-med {
      background: #d97706;
    }
    .ck-card-accent-risk-low {
      background: #2563eb;
    }
    .ck-card-category-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.2px;
    }
    .ck-flow-items {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .ck-flow-item {
      padding: 0;
      margin: 0;
      border: none;
    }
    .ck-item-header {
      font-size: 0.88rem;
      line-height: 1.55;
      color: #1e293b;
    }
    .ck-item-bullet {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-right: 4px;
      display: inline-block;
      user-select: none;
    }
    .ck-card-title {
      font-weight: 600;
      color: #0f172a;
      margin-right: 6px;
      display: inline;
    }
    .ck-pill {
      display: inline-block;
      padding: 0 5px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      line-height: 1.35;
      vertical-align: 1px;
      margin-right: 5px;
      white-space: nowrap;
    }
    .ck-pill-high, .ck-flow-high {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .ck-pill-medium, .ck-flow-medium {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .ck-pill-low, .ck-flow-low {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }
    .ck-item-meta {
      display: inline-block;
      font-size: 0.78rem;
      color: #64748b;
      margin-right: 6px;
      white-space: nowrap;
    }
    .ck-card-drawer {
      margin: 2px 0 0 12px;
      padding: 1px 0 1px 8px;
      border-left: 2px solid #e2e8f0;
      background: transparent;
      border-radius: 0;
      border-top: none;
      border-right: none;
      border-bottom: none;
      font-size: 0.8rem;
      color: #475569;
      line-height: 1.45;
    }
    .ck-card-drawer-high {
      border-left: 2px solid #ef4444;
    }
    .ck-card-drawer-med {
      border-left: 2px solid #f59e0b;
    }
    .ck-card-row {
      margin: 1px 0;
    }
    .ck-card-row:first-child {
      margin-top: 0;
    }
    .ck-card-label {
      font-weight: 600;
      color: #334155;
    }
    .ck-card-empty, .ck-flow-empty {
      text-align: center;
      color: #94a3b8;
      padding: 28px 0;
      font-size: 0.88rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    @media print {
      .ck-card { break-inside: avoid; }
      .ck-flow-item { break-inside: avoid; }
    }

    @media(max-width: 860px) {
      .ck-doc { padding: 22px 18px; }
      .ck-review { grid-template-columns: 1fr; }
      .ck-review-rule { display: none; }
    }


    .ck-doc-meta {
      font-style: normal;
      color: #555555;
      font-size: 0.8rem;
    }
    .ck-doc blockquote, .ck-quote {
      font-style: normal;
    }
    .summary-table {
      margin: 10px 0 24px;
    }
    .summary-table th {
      font-size: 0.82rem;
      white-space: nowrap;
    }
    .summary-table td {
      font-size: 0.82rem;
    }
    .col-title a {
      color: #111111;
      text-decoration: underline;
