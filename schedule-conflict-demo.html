<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>说话人排期任务示意</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --surface: #fffdf8;
      --ink: #1f2623;
      --muted: #6d7773;
      --line: #d8ddd9;
      --line-soft: rgba(31, 38, 35, .08);
      --green: #0c7a63;
      --green-soft: #dff2eb;
      --red: #b6403b;
      --red-soft: #fde9e7;
      --blue: #315f7d;
      --blue-soft: #e5eef4;
      --shadow: 0 26px 70px rgba(44, 39, 31, .14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 36px;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1120px, 100%);
      padding: 34px 38px 38px;
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.12;
      letter-spacing: 0;
      font-weight: 750;
    }

    .tag {
      flex: 0 0 auto;
      padding: 8px 13px;
      border-radius: 999px;
      background: #f1eee7;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
    }

    .board {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .people,
    .timeline {
      display: grid;
      grid-template-rows: 44px repeat(3, 86px);
      row-gap: 18px;
    }

    .label {
      display: flex;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      color: var(--muted);
      font-size: 20px;
      font-weight: 750;
      text-align: center;
    }

    .person {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 14px;
      align-items: center;
      min-width: 0;
    }

    .avatar {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 18px;
      font-weight: 800;
    }

    .name {
      display: block;
      margin-bottom: 4px;
      font-size: 20px;
      font-weight: 760;
    }

    .quote {
      display: block;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lane {
      position: relative;
      min-height: 86px;
      border-radius: 18px;
      background:
        linear-gradient(90deg,
          transparent calc(20% - .5px),
          var(--line-soft) calc(20% - .5px),
          var(--line-soft) calc(20% + .5px),
          transparent calc(20% + .5px),
          transparent calc(40% - .5px),
          var(--line-soft) calc(40% - .5px),
          var(--line-soft) calc(40% + .5px),
          transparent calc(40% + .5px),
          transparent calc(60% - .5px),
          var(--line-soft) calc(60% - .5px),
          var(--line-soft) calc(60% + .5px),
          transparent calc(60% + .5px),
          transparent calc(80% - .5px),
          var(--line-soft) calc(80% - .5px),
          var(--line-soft) calc(80% + .5px),
          transparent calc(80% + .5px));
      border-top: 1px solid var(--line);
    }

    .task {
      position: absolute;
      top: 18px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 118px;
      padding: 0 18px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 19px;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(12, 122, 99, .35);
      white-space: nowrap;
    }

    .design {
      left: calc(40% + 12px);
      width: calc(20% - 24px);
    }

    .frontend {
      left: calc(20% + 12px);
      width: calc(40% - 24px);
      background: var(--red-soft);
      color: var(--red);
      box-shadow: inset 0 0 0 1px rgba(182, 64, 59, .38);
    }

    .integration {
      left: calc(60% + 12px);
      width: calc(30% - 24px);
    }

    .axis {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -9px;
      height: 1px;
      background: var(--line);
    }

    @media (max-width: 820px) {
      body {
        padding: 18px;
      }

      main {
        padding: 24px 20px 26px;
        border-radius: 22px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
        margin-bottom: 24px;
      }

      .board {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .people {
        grid-template-rows: auto;
        gap: 12px;
      }

      .people .label {
        margin-bottom: 4px;
      }

      .person {
        min-height: 68px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }

      .timeline {
        grid-template-rows: 36px repeat(3, 76px);
        row-gap: 12px;
      }

      .days {
        font-size: 16px;
      }

      .lane {
        min-height: 76px;
      }

      .task {
        top: 15px;
        height: 46px;
        min-width: auto;
        padding: 0 10px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>按说话人生成排期</h1>
      <div class="tag">会议文本 · 自动抽取</div>
    </header>

    <section class="board" aria-label="按说话人展示的排期任务">
      <div class="people">
        <div class="label">说话人</div>

        <div class="person">
          <div class="avatar">李</div>
          <div>
            <span class="name">李</span>
            <span class="quote">“周三给你设计稿”</span>
          </div>
        </div>

        <div class="person">
          <div class="avatar">王</div>
          <div>
            <span class="name">王</span>
            <span class="quote">“周二开始前端”</span>
          </div>
        </div>

        <div class="person">
          <div class="avatar">张</div>
          <div>
            <span class="name">张</span>
            <span class="quote">“周四联调”</span>
          </div>
        </div>
      </div>

      <div class="timeline">
        <div class="days">
          <span>周一</span>
          <span>周二</span>
          <span>周三</span>
          <span>周四</span>
          <span>周五</span>
        </div>

        <div class="lane">
          <div class="task design">设计稿交付</div>
          <div class="axis"></div>
        </div>

        <div class="lane">
          <div class="task frontend">前端开发</div>
          <div class="axis"></div>
        </div>

        <div class="lane">
          <div class="task integration">联调</div>
          <div class="axis"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
