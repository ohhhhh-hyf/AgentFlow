cm-template-v2:
  scenario-ids:
    meeting-minutes: meeting_minutes
    study-notes: study_notes
    dialogue-interview: dialogue_interview
    job-interview: job_interview
    medical-consultation: medical_consultation
    legal-consultation: legal_consultation
    press-conference: press_conference
    daily-journal: daily_journal
  template-ids:
    meeting-minutes:
      team-meeting: team_meeting
      project-progress: project_progress
      decision-review: decision_review
      workshop-session: workshop_session
      retrospective-session: retrospective_session
      exchange-forum: exchange_forum
    study-notes:
      class-transcript: class_transcript
      special-lecture: special_lecture
      group-seminar: group_seminar
      knowledge-memo: knowledge_memo
      debate-forum: debate_forum
    dialogue-interview:
      research-dialogue: research_dialogue
      interview-transcript: interview_transcript
    job-interview:
      hiring-report: hiring_report
      interview-debrief: interview_debrief
    medical-consultation:
      clinical-advisory: clinical_advisory
      psychological-session: psychological_session
    legal-consultation:
      legal-advisory: legal_advisory
      court-transcript: court_transcript
      contract-vetting: contract_vetting
    press-conference:
      media-briefing: media_briefing
      product-launch: product_launch
      government-bulletin: government_bulletin
      media-qa-session: media_qa_session
    daily-journal:
      general-minutes: general_minutes
      personal-memo: personal_memo
      conversation-transcript: conversation_transcript
      site-visit-tour: site_visit_tour
      home-school-liaison: home_school_liaison
    user-customized: user_customized
    expired:
      meeting-minutes: meeting_minutes
      dialogue-interview: dialogue_interview
      study-notes: study_notes
      intelligence-meeting-minutes: intelligence_meeting_minutes
  default-template-id: "${cm-template-v2.template-ids.daily-journal.general-minutes}"
  user-customized-template-id: "${cm-template-v2.template-ids.user-customized}"
  scenarios:
    - id: "${cm-template-v2.scenario-ids.meeting-minutes}"
      name: 会议
      time-alias: 记录时间：
      address-alias: 地点：
      attendees-alias: 参与人员：
    - id: "${cm-template-v2.scenario-ids.study-notes}"
      name: 学习
      time-alias: 记录时间：
      address-alias: 地点：
      attendees-alias: 主讲人员：
    - id: "${cm-template-v2.scenario-ids.dialogue-interview}"
      name: 访谈
      time-alias: 记录时间：
      address-alias: 地点：
      attendees-alias: 参与人员：
    - id: "${cm-template-v2.scenario-ids.job-interview}"
      name: 面试
      time-alias: 记录时间：
      address-alias: 地点：
      attendees-alias: 参与人员：
    - id: "${cm-template-v2.scenario-ids.medical-consultation}"
      name: 医疗问诊
      time-alias: 记录时间：
      address-alias: 地点：
      attendees-alias: 参与人员：
    - id: "${cm-template-v2.scenario-ids.legal-consultation}"
      name: 法律沟通
      time-alias: 记录时间：
      address-alias: 地点：
      attendees-alias: 参与人员：
    - id: "${cm-template-v2.scenario-ids.press-conference}"
      name: 新闻发布
      time-alias: 记录时间：
      address-alias: 地点：
      attendees-alias: 参与人员：
    - id: "${cm-template-v2.scenario-ids.daily-journal}"
      name: 日常记录
      time-alias: 记录时间：
      address-alias: 地点：
      attendees-alias: 参与人员：
  templates:
    - id: "${cm-template-v2.template-ids.meeting-minutes.team-meeting}"
      scenario-id: "${cm-template-v2.scenario-ids.meeting-minutes}"
      order: 1
      visible: true
      name: 团队例会
      description: 梳理团队进展
      detail: |-
        # 例会信息
        主题：根据团队例会内容生成的主题
        时间：记录时间
        参会人：录音参与人

        # 例会概况
        根据内容生成本次例会的整体概况描述

        # 工作进展
        | 责任人 | 工作事项 | 状态 | 阻塞/风险 | 下一步与时间节点 |
        | --- | --- | --- | --- | --- |
        | 责任人A | 事项名称 | 🔄进行中 | 风险或依赖说明 | 无 |

        # 协作需求
        - 协作事项一
        - 协作事项二
        - 依赖关系

        # 待办
        - 待办事项具体内容
      requirement: |-
        忠实记录团队成员汇报的工作进展、待办事项、协作需求及临时讨论结论，聚焦"谁、做了什么、做到什么程度、下一步做什么"四要素，明确责任人与时间节点；只记录原文出现的事实，不添加推测性解读，不遗漏任何成员的发言
      format: |-
        # [例会概况]  
        [以一段话概括本次例会的主要内容]

        # [工作进展]  
        [按成员或任务维度，对工作的状态与计划进行总结，使用markdown多层级进行呈现，或利用表格形式进行总结，状态可以使用 ✅已完成 / 🔄进行中 / ⛔阻塞 标注；关键阻塞、延期节点或高风险事项需用 **具体内容** 强调，任务名、版本号、工单号等可使用 `具体内容` 标注。任务描述应简洁明确，避免冗长，突出关键信息]

        # [协作需求]  
        [列出成员间提出的协作请求、跨人/跨组依赖项及需要支持的事项。内容应具体、可操作，避免模糊或重复。标题应准确反映内容，与摘要中其他部分任务保持对应关系，确保逻辑连贯]
    - id: "${cm-template-v2.template-ids.meeting-minutes.project-progress}"
      scenario-id: "${cm-template-v2.scenario-ids.meeting-minutes}"
      order: 2
      visible: true
      name: 项目进度会
      description: 追踪项目进度
      detail: |-
        # 项目信息
        项目：根据项目进度会内容生成的项目名称
        时间：记录时间
        参与方：录音参与人

        # 项目概况
        根据内容生成本次项目进度会的整体概况描述

        # 进度追踪
        | 模块 | 进展 | 状态 |
        | --- | --- | --- |
        | 模块一 | 具体进展 | 正常推进 |

        # 风险预警
        | 风险项 | 影响范围 | 责任人 | 协调动作 |
        | --- | --- | --- | --- |
        | 风险描述 | 影响说明 | 责任人 | 应对措施 |

        # 后续计划
        - **核心目标**：关键目标
        - 关键时间点：时间节点
        - *依赖前提：前置条件说明*

        # 待办
        - 待办事项具体内容
      requirement: |-
        客观记录项目各阶段的里程碑达成情况、进度偏差、风险预警及资源协调需求，聚焦项目健康度与关键路径，进度数据须与原文一致；严禁夸大进度、隐瞒延期或风险，风险须标注等级与责任人
      format: |-
        # [项目概况]
        [一段话概括本次项目进度会的主要内容]

        # [进度追踪]
        [关注项目各个模块的进展、存在风险、当前状态等内容，可以使用markdown多层级进行呈现，或利用表格形式进行总结]

        | 模块 | 进展 | 状态 |
        | --- | --- | --- |
        | … | … | … |

        # [风险预警]
        [列出阻碍进度的风险点、依赖项及资源瓶颈，逐条标注**风险等级（高/中/低）**、责任人与应对计划，若某项在原文未提及则标注无。关键延期、里程碑阻塞可用 **具体内容** 提醒，可用 🟢正常 / 🟡低风险 / 🔴高风险 标注整体健康度]

        | 风险/瓶颈 | 等级 | 影响 | 责任人 | 应对计划 |
        | --- | --- | --- | --- | --- |
        | … | 🟢正常 | … | … | … |

        # [后续计划]
        [明确下一周期的核心交付物、验收标准及关键时间节点，关键交付物**具体内容**；存在依赖前提或外部假设的计划可用 *具体内容* 单独提示]
    - id: "${cm-template-v2.template-ids.meeting-minutes.decision-review}"
      scenario-id: "${cm-template-v2.scenario-ids.meeting-minutes}"
      order: 3
      visible: true
      name: 决策评审会
      description: 记录评审结论
      detail: |-
        # 评审信息
        议题：根据决策评审会内容生成的主题
        时间：记录时间
        参与方：录音参与人

        # 评审议题概况
        根据内容生成本次决策评审会的整体概况描述

        # 方案陈述
        ## 方案一描述
        - 核心论点：主要内容
        - 支撑依据：主要内容

        ## 方案二描述
        - 核心论点：主要内容
        - 支撑依据：主要内容

        # 最终决议
        - **最终结论**
        - **执行要求**
        - **附加条件**

        # 遗留问题
        - [ ] 遗留问题一
        - [ ] 遗留问题二

        # 待办
        - 待办事项具体内容
      requirement: |-
        精准记录评审方案的背景、各方核心论点、数据支撑、最终决议及遗留问题，聚焦决策逻辑链条（提出—论证—质疑—结论）与最终结论；忠实还原赞成与反对意见，不得篡改、合并或主观臆断评审意见
      format: |-
        # [评审议题概况]
        [一段话概括本次评审会的主要内容及评审结论]

        # [方案陈述]
        [提炼方案的核心价值与数据支撑；当赞成、反对意见较多时，用表格对照呈现，否则分点列出；关键原话式质疑、保留意见或一针见血的判断可用 > 引用突出]

        | 核心论点 | 数据/案例支撑 |
        | --- | --- |
        | … | … |
        | … | … |

        # [最终决议]
        [明确记录决策结论、生效条件、后续执行要求；最终结论请 **具体内容** 呈现。若驳回或有条件通过，须列出**否决原因**或**附加条件**；附加条件、保留意见可用 *具体内容* 补充]

        # [遗留问题]
        [记录评审中未决事项、需补充调研的内容及后续复审计划]
    - id: "${cm-template-v2.template-ids.meeting-minutes.workshop-session}"
      scenario-id: "${cm-template-v2.scenario-ids.meeting-minutes}"
      order: 4
      visible: true
      name: 工作研讨会
      description: 提炼研讨观点
      detail: |-
        # 研讨信息
        主题：根据工作研讨会内容生成的主题
        时间：记录时间
        参与人：录音参与人

        # 研讨背景与议题
        根据内容生成本次研讨会的整体概况描述

        # 核心观点
        - 观点一的主要内容
        - 观点二的主要内容

        # 达成共识与解决方案
        - 达成的共识
        - 拟采用的解决方案

        # 未决分歧与后续探索
        - 未决问题
        - 后续验证方向

        # 待办
        - 待办事项具体内容
      requirement: |-
        忠实提炼研讨过程中的核心议题、各方观点碰撞、达成的共识及未决分歧，聚焦思想碰撞与问题解决的逻辑，完整保留有价值的创新思路；避免流水账式记录，不遗漏关键分歧
      format: |-
        # [研讨背景与议题]
        [一段话概括研讨主题、参与人员及核心探讨的业务/技术痛点]

        # [核心观点]
        [按议题维度梳理：不同视角的观点、提出的创新思路、数据或案例支撑。观点交锋激烈处可标注分歧双方]

        # [达成共识与解决方案]
        [提炼研讨后形成的统一认知、可落地的解决思路或方法论，关键结论用**加粗**]

        # [未决分歧与后续探索]
        [记录未能当场解决的争议点、需进一步验证的假设及后续行动方向，若存在事项跟进人则进行标注]
    - id: "${cm-template-v2.template-ids.meeting-minutes.retrospective-session}"
      scenario-id: "${cm-template-v2.scenario-ids.meeting-minutes}"
      order: 5
      visible: true
      name: 总结复盘会
      description: 内容总结复盘
      detail: |-
        # 复盘信息
        主题：根据总结复盘会内容生成的主题
        时间：记录时间
        参与人：录音参与人

        # 复盘目标与结果概况
        根据内容生成本次复盘会的整体概况描述

        # 亮点事项
        - ✅ 亮点一主要内容
        - ✅ 亮点二主要内容
        - 成功原因分析总结

        # 不足事项
        - ⚠️ 问题一主要内容
        - ⚠️ 问题二主要内容
        - 失败原因分析总结

        # 改进计划
        - 整体概括总结
        - [ ] 改进计划一 
        - [ ] 改进计划二 

        # 待办
        - 待办事项具体内容
      requirement: |-
        客观还原项目/事件的预期目标与实际结果，深度剖析成功根因与失败教训，聚焦经验沉淀与改进措施；归因须深入到根本原因而非表面现象，严禁推诿扯皮或情绪化表达
      format: |-
        # [复盘目标与结果概况]
        [一段话概括本次总结复盘会的主要内容]

        # [亮点事项]
        [提炼原文指出的超出预期的成果，并深度剖析促成成功的关键动作、策略或外部因素；最具复用价值的经验或动作可用 **具体内容** 突出]

        # [不足事项]
        [客观记录原文指出的未达预期的环节，可用「现象 → 原因 」的结构呈现；关键根因、高复发风险项可用 **具体内容** 强调]

        # [改进计划]
        [提炼原文指出的后续改进计划，流程名、指标名可用 `具体内容` 标注，若原文不存在明确责任人或时间，则填写“无”即可，禁止编造]
    - id: "${cm-template-v2.template-ids.meeting-minutes.exchange-forum}"
      scenario-id: "${cm-template-v2.scenario-ids.meeting-minutes}"
      order: 6
      visible: true
      name: 沟通交流会
      description: 整理沟通结果
      detail: |-
        # 沟通信息
        主题：根据沟通交流会内容生成的主题
        时间：记录时间
        沟通方：录音参与人

        # 沟通背景与目的
        根据内容生成本次交流会的整体概况描述

        # 信息同步
        - 内容一讨论
        - 内容二讨论

        # 达成共识
        - 承诺事项一主要内容
          > 与承诺事项一相关的关键原文引用
        - 承诺事项二主要内容

        # 待协调事项
        - [ ] 待协调事项一
        - [ ] 待协调事项二

        # 待办
        - 待办事项具体内容
      requirement: |-
        准确记录双方/多方沟通的核心诉求、信息同步内容、达成的共识及需协调事项，聚焦沟通目的与结果，完整还原各方立场；不得曲解对方意图或选择性记录。需确保发言者身份标识准确无误，信息归属清晰可辨；在提炼与压缩发言内容时，应保持逻辑关系完整，因果链条清晰，避免信息失真或语义断裂；对关键表述、特殊语气或语境依赖较强的语句，应通过引用或转述方式保留其原始语义，以确保上下文理解的准确性与完整性
      format: |-
        # [沟通背景与目的]  
        [以一段话概括本次沟通交流会的主要内容]

        # [信息同步]  
        [按参与方或事项维度逐项梳理关键信息、提出的核心诉求及关注点，每个部分独立成子章节；若信息量较大，可按子议题进一步分段，以提升可读性；避免使用模糊表述，确保信息清晰、准确]

        # [达成共识]  
        [记录各方确认的信息、达成的共识及作出的承诺，关键承诺需**加粗**，以突出其重要性；若需逐字保留承诺原话，应使用 > 引用格式]

        # [待协调事项]  
        [明确需跨部门/跨团队协调的事项，每项应包含事项描述、对接人、负责人及预计完成时间或后续沟通计划，若某项不存在则填写“无”；每条事项独立成子节，结构清晰，便于后续跟踪与执行]
    - id: "${cm-template-v2.template-ids.study-notes.class-transcript}"
      scenario-id: "${cm-template-v2.scenario-ids.study-notes}"
      order: 7
      visible: true
      name: 课堂记录
      description: 整理课堂重点
      detail: |-
        # 课堂信息
        课程：根据课堂记录内容生成的主题
        时间：记录时间
        主讲人：录音参与人

        # 课程概况
        根据内容生成本次课程的整体概况描述

        # 核心知识点梳理
        - **重点概念**：概念或知识点
        - ⭐ 难点提示：难点说明

        # 课堂互动与答疑
        - 问：问题内容
          答：回答内容
        - 问：问题内容
          答：回答内容
        > 教师提醒或关键原话

        # 课后任务与学习建议
        - [ ] 课后任务
        - [ ] 复习重点
        - [ ] 推荐阅读或练习

        # 待办
        - 待办事项具体内容
      requirement: |-
        精准记录课程核心知识点、教师讲授逻辑、重点难点及课堂互动，聚焦教学内容与学习目标，完整保留关键概念、公式与案例；不得遗漏重难点或曲解教师原意
      format: |-
        # [课程概况]
        [一段话概括本次课程的主要内容]

        # [核心知识点梳理]
        [按教学逻辑梳理核心概念、理论模型、关键公式/案例；重点用**加粗**、难点用 ⭐ 标注，术语/公式/命令用 `具体内容` 标注；易混点可用 *具体内容* 提醒，便于复习时快速定位]

        # [课堂互动与答疑]
        [记录学生提出的典型问题、教师的解答要点及延伸思考，可用「问 → 答」形式呈现；教师值得记忆的原话、口诀或提醒可用 > 引用]

        # [课后任务与学习建议]
        [明确教师强调的复习重点及教师推荐的学习建议，若存在作业内容也可列出]
    - id: "${cm-template-v2.template-ids.study-notes.special-lecture}"
      scenario-id: "${cm-template-v2.scenario-ids.study-notes}"
      order: 8
      visible: true
      name: 专题讲座
      description: 提炼讲座观点
      detail: |-
        # 讲座信息
        主题：根据专题讲座内容生成的主题
        时间：记录时间
        主讲人：录音参与人

        # 讲座概况
