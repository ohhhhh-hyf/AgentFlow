        [用一段话概括问答场合的基本信息，包括时间、地点、发言人身份、参与媒体或机构、讨论的核心议题]

        # [核心提问与回应]  
        [按议题或逻辑顺序梳理记者提出的核心问题及其对应的官方回应，采用「问 → 答」形式成对呈现。问题需简洁明确，回应要点需完整、准确，若原文回答较长可做凝练总结。问答内容应逻辑清晰，避免冗余，必要时可分段呈现以提升可读性]

        # [媒体关注焦点]  
        [梳理媒体在发布会中最为关注的问题及其回应的传播价值，包括问题的公共关注度、回应的政策意义或社会影响]

        # [信息澄清与表态]  
        [提炼发言人对热点、争议或敏感问题的澄清说明与关键表态，重点内容**加粗**突出。该部分应聚焦于发言人明确立场、纠正误解或强调政策导向的内容]
    - id: "${cm-template-v2.template-ids.daily-journal.general-minutes}"
      scenario-id: "${cm-template-v2.scenario-ids.daily-journal}"
      order: 25
      visible: true
      name: 通用纪要
      description: 适用所有录音摘要
      detail: |-
        #慧记信息
        主题：根据慧记内容生成的主题
        时间：慧记记录时间
        参会人：录音参与人

        #慧记摘要
        根据内容生成整体摘要信息
        ## 总结一
        - 主要内容小结描述
        ## 总结二
        - 主要内容小结描述

        #待办
        - 待办事项具体内容
      requirement: |-
        目的为生成符合选定长度的结构化会议摘要和确保摘要内容准确反映会议核心内容，语气为客观的集成陈述、零情感色彩的官方口吻和非人格化权威表述
      format: |-
        # [全文摘要]
        [用一段话简要概括本段文本的主要内容、关键要点、核心结论]
        ## [自主概括的议程模块名称]
        - [具体内容描述]
        - [具体内容描述]
        ## [自主概括的议程模块名称]
        - [具体内容描述]
    - id: "${cm-template-v2.template-ids.daily-journal.personal-memo}"
      scenario-id: "${cm-template-v2.scenario-ids.daily-journal}"
      order: 26
      visible: true
      name: 个人备忘
      description: 整理个人备忘
      detail: |-
        # 备忘信息
        日期：记录日期
        主题：根据个人备忘内容生成的主题
        记录人：录音参与人

        # 备忘概况
        根据内容生成备忘的整体概况描述

        # 待办事项与提醒
        - [ ] 🔴 重要事项
        - [ ] ⏰ 包含时间的任务
        - [ ] `关键词或物品` 相关事项
        - [ ] **特别提醒内容**

        # 灵感与想法
        > 灵感原话
        > 想法表达

        # 待办
        - 待办事项具体内容
      requirement: |-
        精准记录个人待办事项、灵感想法、重要提醒及情绪状态，聚焦个人效率与记忆辅助，原始信息须完整保留；不得过度结构化或丢失原始细节
      format: |-
        # [备忘概况]
        [一段话概括备忘日期、核心主题及整体内容]

        # [待办事项与提醒]
        [按优先级用待办清单列出任务，标注截止日期；重要事项用 🔴、涉及时间提醒用 ⏰ 标注；最重要提醒可用 **具体内容** 强调，项目名、地点、账号、物品型号可用 `具体内容` 标注]

        - [ ] 🔴 任务内容 —— 截止时间
        - [ ] 普通任务

        # [灵感与想法]
        [记录突发的灵感、思考及需进一步探索的想法；一闪而过的短句、提醒或灵感原话可用 > 引用]

        # [情绪与自我反思]
        [记录当下的情绪状态、自我反思及调整建议；情绪关键词可用 **具体内容** 标注]
    - id: "${cm-template-v2.template-ids.daily-journal.conversation-transcript}"
      scenario-id: "${cm-template-v2.scenario-ids.daily-journal}"
      order: 27
      visible: true
      name: 对话记录
      description: 提炼对话内容
      detail: |-
        # 对话信息
        主题：根据对话记录内容生成的主题
        时间：记录时间
        相关人：录音参与人

        # 对话概况
        根据内容生成对话的整体概况描述

        # 交流内容
        - 交流内容总结
          - 具体描述

        # 共识与分歧
        | 类型 | 内容 |
        | --- | --- |
        | 已达成共识 | 主要内容 |
        | 仍有分歧 | 主要内容 |

        # 后续规划
        - [ ] 具体任务

        # 待办
        - 待办事项具体内容
      requirement: |-
        忠实记录对话双方的核心交流内容、情感表达及共识/分歧，聚焦沟通本质与信息传递，双方立场须如实还原；不得曲解对话意图或过度精简
      format: |-
        # [对话概况]
        [一段话概括对话双方、对话主题、场景及整体内容]

        # [交流内容]
        [按话题梳理双方表达的核心观点、信息同步及情感表达；关键原话或情绪强烈的表达可用 > 引用，人名、地点、产品名、约定事项可用 `具体内容` 标注]

        # [共识与分歧]
        [提炼双方达成的共识与未解决的分歧，区分呈现；关键共识可用 **加粗**，敏感或仍待确认的判断可用 *具体内容* 标注]

        # [后续规划]
        [若对话中提及承诺及后续行动可在此章节呈现，若不存在则无需此章节]
    - id: "${cm-template-v2.template-ids.daily-journal.site-visit-tour}"
      scenario-id: "${cm-template-v2.scenario-ids.daily-journal}"
      order: 28
      visible: true
      name: 参观游览
      description: 记录参观过程
      detail: |-
        # 参观信息
        地点：根据参观游览内容生成的地点
        时间：记录时间
        参与人：录音参与人

        # 参观概况
        根据内容生成本次参观的整体概况描述

        # 核心看点与讲解
        - 看点一
          - 具体讲解
        - 看点二
          - 具体讲解

        # 互动与体验
        - 互动环节：主要内容
        - 体验感受：主要内容

        # 收获与建议
        - 收获：主要内容
        - 建议：主要内容

        # 待办
        - 待办事项具体内容
      requirement: |-
        客观记录参观地点、核心看点、讲解内容及个人感受，聚焦体验与信息获取，讲解中的知识性信息须准确；不得遗漏关键信息或过度抒情
      format: |-
        # [参观概况]
        [一段话概括参观地点、时间、核心主题及整体过程]

        # [核心看点与讲解]
        [按参观路线梳理核心景点/展品、讲解内容及历史/文化背景，体现游览动线，若内容较多可用符合markdown语法的多层级结构展开]

        # [互动与体验]
        [记录参观中的互动环节、体验项目及个人感受]

        # [收获与建议]
        [根据原文内容提炼参观的收获、知识增量及对后续参观者的建议，禁止编造]
