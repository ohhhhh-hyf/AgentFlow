allow = ["Edit", "Bash=cd /d/v4_stdio && cat > /tmp/test_config.py <<'EOF'\nimport os, sys, tempfile\nfrom pathlib import Path\n\nsys.path.insert(0, \"src\")\n\n# 1. 语法 + 导入\nfrom meeting_agent.config import load_env, resolve_llm_settings, LLMSettings\n\n# 2. 无 key 时报错\ntry:\n    resolve_llm_settings()\n    print(\"FAIL: 应报错但没报\")\nexcept ValueError as e:\n    print(\"OK 无key报错:\", str(e)[:50])\n\n# 3. 临时 .env 只配 DEEPSEEK_API_KEY\nenv_file = Path(tempfile.mkstemp(suffix=\".env\")[1])\nenv_file.write_text(\"DEEPSEEK_API_KEY=sk-test123\\n\", encoding=\"utf-8\")\nload_env(env_file)\ncfg = resolve_llm_settings()\nprint(\"OK 最小配置:\", cfg.provider, cfg.model, cfg.base_url, cfg.temperature, cfg.api_key)\nassert cfg.provider == \"deepseek\" and cfg.model == \"deepseek-chat\"\nassert cfg.base_url == \"https://api.deepseek.com\" and cfg.temperature == 0.0\n\n# 4. 覆盖项生效\nenv_file.write_text(\"DEEPSEEK_API_KEY=sk-test123\\nDEEPSEEK_MODEL=deepseek-reasoner\\nDEEPSEEK_TEMPERATURE=0.5\\n\", encoding=\"utf-8\")\nload_env(env_file)\ncfg2 = resolve_llm_settings()\nprint(\"OK 覆盖配置:\", cfg2.model, cfg2.temperature)\nassert cfg2.model == \"deepseek-reasoner\" and cfg2.temperature == 0.5\n\n# 5. 占位符视为未配置\nos.environ[\"DEEPSEEK_API_KEY\"] = \"your_api_key_here\"\ntry:\n    resolve_llm_settings()\n    print(\"FAIL: 占位符未拦截\")\nexcept ValueError:\n    print(\"OK 占位符拦截\")\ndel os.environ[\"DEEPSEEK_API_KEY\"]\n\n# 6. client.py 兼容（签名不变）\nfrom meeting_agent.client import LLMClient, DeepSeekClient\nc = LLMClient()\nprint(\"OK client兼容:\", c.provider, c.model, c.base_url, c.temperature)\nassert DeepSeekClient is LLMClient\n\n# 7. 显式参数优先级最高\nc2 = LLMClient(api_key=\"sk-direct\", model=\"deepseek-reasoner\")\nprint(\"OK 显式参数:\", c2.model)\nassert c2.api_key == \"sk-direct\"\n\nprint(\"ALL PASS\")\nEOF\n/c/Users/OMEN/miniconda3/envs/agent/python.exe /tmp/test_config.py"]
