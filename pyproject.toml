[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-agent"
version = "0.1.0"
description = "基于 DeepSeek 的多 Agent 个性化会议纪要与待办生成器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_agent"]
