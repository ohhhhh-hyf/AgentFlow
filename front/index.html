<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentFlow 接口调试台</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --border: #e2e5ea; --text: #26282c;
    --muted: #8a8f98; --accent: #3b6fe0; --accent-h: #2f5cc4;
    --danger: #d9534f; --ok: #2e9e5b; --code-bg: #f0f2f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
  }
  header {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header .tag {
    font-size: 12px; color: var(--muted); background: var(--code-bg);
    padding: 2px 8px; border-radius: 10px;
  }
  .layout { display: flex; gap: 16px; padding: 16px 24px; align-items: flex-start; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  /* 左侧：接口列表 */
  .side { width: 300px; flex-shrink: 0; }
  .side h2 { font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
  .side .api-item {
    padding: 8px 10px; border-radius: 7px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid transparent; margin-bottom: 2px;
  }
  .side .api-item:hover { background: var(--code-bg); }
  .side .api-item.active { background: #e8effc; border-color: var(--accent); }
  .side .api-item .method {
    font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
    color: #fff; background: var(--accent); flex-shrink: 0;
  }
  .side .api-item .method.get { background: var(--ok); }
  /* 中间：表单 */
  .main { flex: 1; min-width: 0; }
  .main h2 { font-size: 16px; margin-bottom: 2px; }
  .main .path { font-family: Consolas, monospace; color: var(--muted); font-size: 13px; }
  .main .desc { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 4px;
  }
  .field label .key { font-family: Consolas, monospace; font-weight: 400; color: var(--muted); font-size: 12px; }
  .field .req { color: var(--danger); font-size: 12px; font-weight: 700; }
  .field .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff;
  }
  .field textarea { min-height: 56px; resize: vertical; font-family: Consolas, monospace; font-size: 12.5px; }
  .field textarea.big { min-height: 140px; }
  .field input.invalid, .field textarea.invalid { border-color: var(--danger); background: #fdf0f0; }
  .field textarea.docs-list { min-height: 72px; }
  .docs-pick, .file-load {
    display: flex; gap: 6px; margin-top: 4px; align-items: center; flex-wrap: wrap;
  }
  .docs-pick select {
    min-width: 220px; max-width: 46%; padding: 4px 8px; border: 1px solid var(--border);
    border-radius: 5px; font-size: 12px; font-family: Consolas, monospace; background: #fff;
  }
  .docs-pick input[type=text] {
    flex: 1; min-width: 140px; padding: 4px 8px; border: 1px solid var(--border);
    border-radius: 5px; font-size: 12px; font-family: Consolas, monospace;
  }
  .docs-pick button {
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--code-bg); font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .docs-pick button:hover { background: #e4e7ec; }
  .file-load input {
    flex: 1; padding: 4px 8px; border: 1px solid var(--border); border-radius: 5px;
    font-size: 12px; font-family: Consolas, monospace;
  }
  .file-load button {
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--code-bg); font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .file-load button:hover { background: #e4e7ec; }
  .file-load .fl-msg, .docs-pick .fl-msg { font-size: 12px; color: var(--muted); }
  .file-load .fl-msg.err, .docs-pick .fl-msg.err { color: var(--danger); }
  .field .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .field .checkbox-row input { width: 16px; height: 16px; }
  .headers { display: flex; gap: 12px; margin-bottom: 14px; }
  .headers .field { flex: 1; margin-bottom: 0; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .btn {
    padding: 8px 22px; border: none; border-radius: 7px; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-h); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  .btn-plain { background: var(--code-bg); color: var(--text); }
  .actions .status { font-size: 13px; }
  .status .ok { color: var(--ok); font-weight: 700; }
  .status .err { color: var(--danger); font-weight: 700; }
  .json-view {
    background: var(--code-bg); border-radius: 8px; padding: 10px 12px;
    font-family: Consolas, monospace; font-size: 12.5px; white-space: pre-wrap;
    word-break: break-all; max-height: 420px; overflow: auto; margin-top: 6px;
  }
  .text-out {
    background: #fffdf5; border: 1px solid #eee3c8; border-radius: 8px;
    padding: 10px 16px; font-size: 13px; line-height: 1.65; word-break: break-word;
    max-height: 480px; overflow: auto;
  }
  .text-out h1, .text-out h2, .text-out h3, .text-out h4 { margin: 14px 0 6px; line-height: 1.35; }
  .text-out h1 { font-size: 1.35rem; } .text-out h2 { font-size: 1.15rem; }
  .text-out h3 { font-size: 1.02rem; }
  .text-out table { border-collapse: collapse; margin: 8px 0; width: 100%; background: #fff; }
  .text-out th, .text-out td { border: 1px solid #e2dcc8; padding: 6px 8px; }
  .text-out th { background: #f7f1de; }
  .text-out ul, .text-out ol { margin: 6px 0; padding-left: 1.4em; }
  .text-out p { margin: 6px 0; }
  .dl-btn {
    display: inline-block; margin-left: 8px; padding: 2px 10px;
    background: var(--ok); color: #fff; border-radius: 5px;
    font-size: 12px; text-decoration: none; font-weight: 600;
  }
  .resp-block { margin-top: 10px; }
  .resp-block h3 {
    font-size: 13px; color: var(--muted); margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .log-view {
    background: #1e2227; color: #c8d0da; border-radius: 8px;
    padding: 10px 12px; font-family: Consolas, monospace; font-size: 12px;
    max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    line-height: 1.55;
  }
  .log-view .lv { color: #6b7686; margin-right: 6px; }
  .log-view .INFO { color: #8ab4f8; }
  .log-view .WARNING { color: #fdd663; }
  .log-view .ERROR, .log-view .CRITICAL { color: #f28b82; }
  .log-view .DEBUG { color: #7b8794; }
  .log-empty, .log-view .log-empty-inline { color: var(--muted); font-size: 12px; padding: 6px 2px; }
  .log-live-flag {
    font-size: 12px; color: var(--accent); font-weight: 400;
  }
  .loading { color: var(--accent); font-size: 13px; }
  @media (max-width: 900px) { .layout { flex-direction: column; } .side { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>⚡ AgentFlow 接口调试台</h1>
  <span class="tag">简易前端 · 表单直填 · 自动拼装请求体</span>
</header>

<div class="layout">
  <!-- 左侧接口列表 -->
  <aside class="panel side">
    <h2>会议域</h2>
    <div id="list-meeting"></div>
    <h2>笔记域</h2>
    <div id="list-notes"></div>
    <h2>系统</h2>
    <div id="list-system"></div>
  </aside>

  <!-- 中间表单 -->
  <main class="panel main">
    <div id="form-area"></div>
  </main>
</div>

<script src="/front/app.js?v=docs-list3"></script>
</body>
</html>
